name: Template smoke
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      force-full:
        description: 可复用调用默认执行完整验证。
        type: boolean
        default: true
  workflow_dispatch:
jobs:
  template-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        uses: ./.github/actions/ci-scope
        with:
          scope: template-smoke
          force-full: ${{ inputs.force-full || false }}
      - name: Test release scripts
        if: steps.changes.outputs.run == 'true'
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py' -v
      - uses: actions/setup-java@v4
        if: steps.changes.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.run == 'true'
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        if: steps.changes.outputs.run == 'true'
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.changes.outputs.run == 'true'
        working-directory: frontend
      - name: New projects and existing-project upgrades
        run: bash deploy/upgrade-smoke/run.sh "$RUNNER_TEMP/forge-upgrade"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: steps.changes.outputs.run == 'true'
      - uses: actions/upload-artifact@v4
        if: always() && steps.changes.outputs.run == 'true'
        with:
          name: template-smoke
          # private/ 保留随机凭证、原始 URL 与完整工程；仅上传审阅过的脱敏导出。
          path: ${{ runner.temp }}/forge-upgrade/diagnostics/
          retention-days: 7
