name: SDK snapshot integration
on:
  push:
    branches: [main]
    paths: ['backend/**', 'scripts/release/**', '.github/workflows/sdk-snapshot.yml']
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-snapshot
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/backend-quality.yml
  publish-and-consume:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Publish snapshot and verify external consumer
        env:
          MAVEN_RELEASE_URL: ${{ vars.MAVEN_RELEASE_URL }}
          MAVEN_RELEASE_USERNAME: ${{ github.actor }}
          MAVEN_RELEASE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release/snapshot.sh remote
