name: Backend quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      force-full:
        description: 可复用调用默认执行完整验证。
        type: boolean
        default: true
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 分支上的源码必须是 SNAPSHOT 开发版本，防止发布后源码停在已发布版本号；标签构建（发布）跳过。
      - run: python3 scripts/release/version.py dev
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - id: changes
        uses: ./.github/actions/ci-scope
        with:
          scope: backend
          force-full: ${{ inputs.force-full || false }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # 目录与策略属于 docs，scope 可跳过重检查；目录门禁始终执行并沿用 release 的复用链。
      - name: Test permission catalog commands
        run: python3 -m unittest discover -s scripts/permissions -p 'test_*.py' -v
      - name: Extract permission catalog Git baseline
        run: python3 scripts/permissions/ci_previous.py --output "$RUNNER_TEMP/permission-catalog-previous.json"
      - name: Check permission catalog bytes
        run: python3 scripts/permissions/catalog.py --check --previous "$RUNNER_TEMP/permission-catalog-previous.json"
      - run: docker info
        if: steps.changes.outputs.run == 'true'
      # install 包含 verify，并让生成工程的独立 Maven 进程能解析本次 SDK 制品。
      - run: ./mvnw --batch-mode install -Parchetype-it
        if: steps.changes.outputs.run == 'true'
        working-directory: backend
      - name: Verify SDK dependency gates
        if: steps.changes.outputs.run == 'true'
        run: python3 src/it/sdk-dependency-gate/check.py
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-reports
          path: |
            backend/**/target/surefire-reports/
            backend/**/target/failsafe-reports/
            backend/target/sdk-dependency-gate/*.log
          retention-days: 7
