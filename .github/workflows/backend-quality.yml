name: Backend quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: docker info
      # install 包含 verify，并让生成工程的独立 Maven 进程能解析本次 SDK 制品。
      - run: ./mvnw --batch-mode install -Parchetype-it
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-reports
          path: |
            backend/**/target/surefire-reports/
            backend/**/target/failsafe-reports/
          retention-days: 7
