name: Build and publish images
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_PREFIX: ${{ vars.IMAGE_PREFIX }}
      IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
      OWNER_TYPE: ${{ github.event.repository.owner.type }}
    steps:
      - uses: actions/checkout@v4
      - name: Select image destination and tag
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ -n "$IMAGE_PREFIX" ]]; then
            owner=${REPOSITORY_OWNER,,}
            namespace=${IMAGE_PREFIX#ghcr.io/$owner/}
            if [[ "$IMAGE_PREFIX" != "ghcr.io/$owner/"* || ! "$namespace" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
              echo 'IMAGE_PREFIX must be ghcr.io/<current owner>/<namespace>' >&2
              exit 1
            fi
          fi
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            echo "IMAGE_TAG=sha-$GITHUB_SHA" >> "$GITHUB_ENV"
          else
            python3 scripts/release/version.py check "$RELEASE_TAG"
          fi
      - name: Check existing GHCR packages before building
        if: env.IMAGE_PREFIX != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for name in forge-gateway forge-iam forge-platform demo-service tenant-app platform-console; do
            bash scripts/images/check-package.sh "$name" allow-missing
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: scripts/images/build.sh
      - name: Log in to GHCR
        if: env.IMAGE_PREFIX != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push and pull each image by digest
        if: env.IMAGE_PREFIX != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("frontend/package.json"))["version"])')
          tag=${IMAGE_TAG:-$version}
          for name in forge-gateway forge-iam forge-platform demo-service tenant-app platform-console; do
            image="$IMAGE_PREFIX/$name:$tag"
            id=$(docker image inspect --format '{{.Id}}' "$image")
            source=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' "$image")
            if [[ "$source" != "$IMAGE_SOURCE" ]]; then
              printf 'Source label mismatch for %s: expected=%s actual=%s\n' "$image" "$IMAGE_SOURCE" "$source" >&2
              exit 1
            fi
            bash scripts/images/check-package.sh "$name" allow-missing
            docker push "$image"
            bash scripts/images/check-package.sh "$name"
            digest=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$image" | awk -v repo="$IMAGE_PREFIX/$name@" 'index($0, repo) == 1 { print; exit }')
            if [[ ! "$digest" =~ @sha256:[a-f0-9]{64}$ ]]; then
              printf 'Digest mismatch for %s: expected=%s@sha256:<64 hex> actual=%s\n' "$image" "$IMAGE_PREFIX/$name" "$digest" >&2
              docker image inspect --format 'Available RepoDigests: {{json .RepoDigests}}' "$image" >&2
              exit 1
            fi
            # 删除本地引用，确保验收实际访问 registry 并恢复刚发布的镜像。
            docker image rm "$image"
            docker pull "$digest"
            pulled_id=$(docker image inspect --format '{{.Id}}' "$digest")
            if [[ "$pulled_id" != "$id" ]]; then
              printf 'Image ID mismatch for %s: expected=%s actual=%s\n' "$digest" "$id" "$pulled_id" >&2
              exit 1
            fi
            printf '%s → `%s`\n' "$name" "$digest" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Report build-only mode
        if: env.IMAGE_PREFIX == ''
        run: echo 'IMAGE_PREFIX is unset; all six images were built without publishing.' >> "$GITHUB_STEP_SUMMARY"
