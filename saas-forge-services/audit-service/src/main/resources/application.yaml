spring:
  application:
    name: audit-service
  flyway:
    enabled: false
  datasource:
    url: ${AUDIT_DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/audit_db}
    username: ${AUDIT_DATABASE_USERNAME:audit_app}
    password: ${AUDIT_DATABASE_PASSWORD}
    hikari:
      connection-timeout: 3000
      validation-timeout: 1000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:29092}
    properties:
      request.timeout.ms: 3000
      default.api.timeout.ms: 3000
    consumer:
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate
  cloud:
    nacos:
      username: ${NACOS_AUDIT_USERNAME:?NACOS_AUDIT_USERNAME is required}
      password: ${NACOS_AUDIT_PASSWORD:?NACOS_AUDIT_PASSWORD is required}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:dev}
        ssl:
          enabled: ${NACOS_TLS_ENABLED:false}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:dev}
        service: audit-service
        fail-fast: true
        enabled: true
        ip: ${AUDIT_REGISTER_IP:127.0.0.1}
        port: ${server.port}
  config:
    import: ${SAASFORGE_SECRETS_IMPORT:configtree:./deploy/compose/.secrets/native-local/audit/}
saas.forge:
  environment: ${SAASFORGE_ENVIRONMENT:dev}
  audit:
    required-migration-version: '6'
    example-topic: saas.forge.${saas.forge.environment}.project-service.events
    example-isolation-topic: saas.forge.${saas.forge.environment}.audit-service.example-isolations
    iam-session-topic: saas.forge.${saas.forge.environment}.iam-service.events
    tenant-access-topic: saas.forge.${saas.forge.environment}.tenant-access-service.events
    iam-session-isolation-topic: saas.forge.${saas.forge.environment}.audit-service.iam-session-isolations
    tenant-isolation-topic: saas.forge.${saas.forge.environment}.audit-service.tenant-isolations
server:
  address: ${AUDIT_BIND_ADDRESS:127.0.0.1}
  port: ${AUDIT_HTTP_PORT:8084}

logging:
  structured:
    format:
      console: io.saas.forge.observability.ForgeLogFormatter
management:
  observations:
    enable:
      http.server.requests: false
      http.client.requests: false

---
spring:
  config:
    activate:
      on-profile: "!local-file"
    import: nacos:audit-service.yaml?group=SAAS_FORGE&refreshEnabled=false
