server:
  port: ${FORGE_GATEWAY_PORT:8080}

spring:
  application:
    name: forge-gateway
  # 路由与 Swagger UI 聚合列表只在 Nacos 的 forge-gateway.yaml 中维护。SCA 对不存在的 dataId 只告警
  # 「config ... is empty」而不会启动失败，网关没有路由时先确认 nacos-init 已发布配置
  config:
    import:
      - optional:nacos:forge-common.yaml
      - optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      server-addr: ${FORGE_NACOS_ADDR:127.0.0.1:8848}
  # 响应式链路换线程时，经 context-propagation 把 trace 与租户日志上下文恢复到 MDC
  reactor:
    context-propagation: auto
  data:
    redis:
      host: ${FORGE_REDIS_HOST:127.0.0.1}
      port: ${FORGE_REDIS_PORT:6379}

management:
  otlp:
    metrics:
      export:
        # 与 forge-sdk-web 的默认一致：Boot 默认每分钟推往 localhost:4318，未部署采集端时只会反复报错，部署时显式开启
        enabled: false

logging:
  pattern:
    # 与 forge-sdk-web 的默认一致：[traceId-spanId] 之后追加租户与 Membership，二者都为空时省略
    correlation: "%correlationId%replace([%X{tenant_id},%X{membership_id}] ){'^.,. $', ''}"
