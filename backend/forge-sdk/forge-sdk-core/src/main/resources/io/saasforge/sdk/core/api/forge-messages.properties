# 框架级错误码文案。基础文件即默认语言 zh-CN；增加语言时新建 forge-messages_<语言>.properties
forge.fallback=操作失败，请稍后重试

request.invalid=请检查填写的内容
request.malformed=请求格式不正确
request.notFound=请求的资源不存在
request.methodNotAllowed=不支持该请求方式
request.rateLimited=请求过于频繁，请稍后重试
auth.unauthenticated=登录已失效，请重新登录
auth.forbidden=没有权限执行该操作
tenant.writeBlocked=租户已停用或已过期，当前不能修改数据
system.unavailable=服务暂时不可用，请稍后重试
system.error=系统繁忙，请稍后重试

# 分页与排序参数的逐字段校验
validation.page=页码必须是大于等于 1 的整数
validation.size=每页条数必须是 1 到 100 之间的整数
validation.sort=排序字段或方向不受支持

# forge-sdk-referencedata 的 @DictionaryValue
validation.dictionaryValue=请选择有效的选项

# forge-sdk-storage 的错误码
storage.objectNotFound=文件不存在或已被删除
storage.quotaExceeded=存储空间已达套餐上限，无法继续上传
storage.uploadIncomplete=文件尚未上传完成，请重新上传

io.busy=任务较多，请稍后再试
io.notFound=任务不存在
io.resultUnavailable=结果尚未生成或文件已过期
io.invalidFile=仅支持有效的 .xlsx 文件，请使用下载的模板
io.rowLimit=行数超过上限，请缩小范围后重新提交
io.validationFailed=校验未通过，未写入任何数据，请下载错误报告
io.interrupted=执行中断，请重新提交
io.failed=处理失败，请重新提交

# 资源恢复的共享错误码
resource.restoreConflict=名称或编码已被占用，请先改名或处理冲突记录后再恢复
resource.restoreBlocked=关联资源尚未恢复，请先恢复关联资源后重试
