server:
  port: ${FORGE_IAM_PORT:8101}

spring:
  application:
    name: forge-iam
  config:
    import:
      - optional:nacos:forge-common.yaml
  cloud:
    nacos:
      server-addr: ${FORGE_NACOS_ADDR:127.0.0.1:8848}
  # 应用只用运行账号连接（仅数据读写、非表所有者），DDL 只由 Flyway 以迁移账号执行（ADR-0001）
  datasource:
    url: jdbc:postgresql://${FORGE_DB_HOST:127.0.0.1}:${FORGE_DB_PORT:5432}/forge
    username: iam_app
    password: ${FORGE_IAM_DB_PASSWORD:iam_app}
  flyway:
    user: iam_migrator
    password: ${FORGE_IAM_DB_MIGRATOR_PASSWORD:iam_migrator}
    schemas: iam
    default-schema: iam
    # schema 由 compose 初始化脚本创建并归属迁移账号，迁移账号本身没有建 schema 的权限
    create-schemas: false

  session:
    timeout: 30m
    redis:
      namespace: iam:global:session
  data:
    redis:
      host: ${FORGE_REDIS_HOST:127.0.0.1}
      port: ${FORGE_REDIS_PORT:6379}
# 本地开发地址；代码中不设默认值，部署时以 Nacos 或环境变量覆盖，漏配则启动失败。须与网关、业务服务一致
forge:
  ops:
    token: ${FORGE_IAM_OPS_TOKEN}
  security:
    issuer: http://localhost:8080/iam
    platform:
      issuer: http://localhost:8080/iam/platform
  # 签名密钥文件不存在时会生成新密钥；部署时指向持久化存储，多实例共用同一份文件，漏配则启动失败
  iam:
    signing-key-file: deploy/data/iam/signing.jwk
    platform:
      signing-key-file: deploy/data/iam/platform-signing.jwk
    # 已弃用的静态引导通道；可不配置。正常接入通过控制台登记数据库凭证，空环境值不启用凭证。
    manifest:
      tokens:
        demo-service: ${FORGE_DEMO_MANIFEST_TOKEN:}
        lowcode-service: ${FORGE_LOWCODE_MANIFEST_TOKEN:}
        # forge-platform 以此读取 GET /internal/permissions 与 /internal/permission-tree，供套餐的 Feature Pack 选择
        forge-platform: ${FORGE_PLATFORM_MANIFEST_TOKEN:}
    # 加密 TOTP 密钥的 AES-256 密钥（Base64）；本地开发值，部署时必须以 Nacos 或环境变量覆盖，多实例一致，代码中不设默认值。
    # 更换后已绑定的 Authenticator 全部无法解密
    mfa:
      encryption-key: eHgDCk5qvfS/amjtqic2I8Onm8vK8yP1fQUlBLxmIqk=
    # 邀请链接指向 tenant-app 的外部地址，邀请令牌以 invitation 参数附在其后
    invitation:
      accept-url: http://localhost:5174/invitations/accept
    # 当前部署的环境名：从 App Registry 各环境的 remoteEntry 地址中选取这一个下发给 Shell App；部署时以 Nacos 或环境变量覆盖
    sub-app:
      environment: ${FORGE_ENVIRONMENT:local}
  mq:
    endpoints: ${FORGE_ROCKETMQ_ENDPOINTS:127.0.0.1:8081}
mybatis-plus:
  mapper-locations: classpath*:/*/mapper/**/*.xml
  configuration:
    arg-name-based-constructor-auto-mapping: true
