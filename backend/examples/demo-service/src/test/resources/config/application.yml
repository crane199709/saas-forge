# classpath:/config/application.yml 优先级高于主配置并与之合并：测试不依赖 Nacos，统一在这里关闭
spring:
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
# 不连接 MQ 的测试关闭投递器与消费端；发布的事件照常写入 Outbox。Outbox 链路测试单独开启并连接测试容器
forge:
  ops:
    token: test-demo-service-ops-token
  # 生产与本地开发由 Nacos 共享配置 forge-common.yaml 提供；测试不连接 Nacos
  business-zone: Asia/Shanghai
  mq:
    enabled: false
  # 测试不连接 iam；清单内容由 ResourceManifestTest 直接生成校验
  manifest:
    enabled: false
  # 多数测试不启动 Redis 或不发布租户状态；写入保护由 TenantLifecycleTest 单独开启验证
  tenant:
    write-guard:
      enabled: false
