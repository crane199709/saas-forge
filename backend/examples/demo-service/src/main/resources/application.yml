server:
  port: ${FORGE_DEMO_PORT:8201}

spring:
  application:
    name: demo-service
  config:
    import:
      - optional:nacos:forge-common.yaml
  cloud:
    nacos:
      server-addr: ${FORGE_NACOS_ADDR:127.0.0.1:8848}
  # 应用只用运行账号连接（仅数据读写、非表所有者），DDL 只由 Flyway 以迁移账号执行（ADR-0001）
  datasource:
    url: jdbc:postgresql://${FORGE_DB_HOST:127.0.0.1}:${FORGE_DB_PORT:5432}/forge
    username: demo_app
    password: ${FORGE_DEMO_DB_PASSWORD:demo_app}
  flyway:
    user: demo_migrator
    password: ${FORGE_DEMO_DB_MIGRATOR_PASSWORD:demo_migrator}
    schemas: demo
    default-schema: demo
    # schema 由 compose 初始化脚本创建并归属迁移账号，迁移账号本身没有建 schema 的权限
    create-schemas: false
  data:
    redis:
      host: ${FORGE_REDIS_HOST:127.0.0.1}
      port: ${FORGE_REDIS_PORT:6379}
forge:
  # 本地开发地址；代码中不设默认值，部署时以 Nacos 或环境变量覆盖，漏配则启动失败
  security:
    issuer: http://localhost:8080/iam
    jwk-set-uri: http://localhost:8101/oauth2/jwks
  mq:
    endpoints: ${FORGE_ROCKETMQ_ENDPOINTS:127.0.0.1:8081}
  # 启动时向 iam 上报 Resource Manifest；改动权限码、名称、菜单、角色模板或 Data Resource 时升级 version。iam-uri 是直连 iam 的内部地址，
  # token 须与 iam forge.iam.manifest.tokens.demo-service 一致
  manifest:
    version: 3
    iam-uri: http://localhost:8101
    token: ${FORGE_DEMO_MANIFEST_TOKEN:local-demo-manifest-token}
mybatis-plus:
  mapper-locations: classpath*:/*/mapper/**/*.xml
