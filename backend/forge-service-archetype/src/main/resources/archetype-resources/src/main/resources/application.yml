#set( $dollar = '$' )
#set( $hash = '#' )
server:
  forward-headers-strategy: framework
  ${hash} 业务服务部署端口：平台运维
  port: ${dollar}{FORGE_SERVICE_PORT}
spring:
  application:
    name: ${serviceName}
  config:
    import: optional:nacos:forge-common.yaml
  cloud:
    nacos:
      ${hash} 配置与服务发现地址：平台运维（接入清单第 4 步）
      server-addr: ${dollar}{FORGE_NACOS_ADDR}
  datasource:
    ${hash} JDBC URL、运行账号与密码：数据库准备步骤；URL 包含数据库名
    url: ${dollar}{FORGE_DB_URL}
    username: ${dollar}{FORGE_DB_USER}
    password: ${dollar}{FORGE_DB_PASSWORD}
  flyway:
    ${hash} 迁移账号、密码与 schema：接入清单数据库步骤；运行账号不得持有表
    user: ${dollar}{FORGE_DB_MIGRATOR_USER}
    password: ${dollar}{FORGE_DB_MIGRATOR_PASSWORD}
    schemas: ${dollar}{FORGE_DB_SCHEMA}
    default-schema: ${dollar}{FORGE_DB_SCHEMA}
    create-schemas: false
    placeholders:
      serviceSchema: ${dollar}{FORGE_DB_SCHEMA}
  data:
    redis:
      ${hash} 平台共享 Redis：平台运维提供，权限明细由 IAM 发布
      host: ${dollar}{FORGE_REDIS_HOST}
      port: ${dollar}{FORGE_REDIS_PORT}
forge:
  ops:
    token: ${dollar}{FORGE_OPS_TOKEN}
  security:
    ${hash} Tenant Realm 签发者（网关公开地址）与直连 IAM JWKS 地址：平台运维
    issuer: ${dollar}{FORGE_SECURITY_ISSUER}
    jwk-set-uri: ${dollar}{FORGE_SECURITY_JWK_SET_URI}
  mq:
    ${hash} RocketMQ Proxy gRPC 地址：接入清单 Topic 准备步骤
    endpoints: ${dollar}{FORGE_ROCKETMQ_ENDPOINTS}
  # SDK 异步有限重试与补报；只读 /internal/onboarding-status 由独立 forge.ops.token 保护
  manifest:
    version: 1
    ${hash} IAM 内部地址；凭证由 Operator 在控制台登记，明文只显示一次，注入 FORGE_MANIFEST_TOKEN。
    ${hash} 轮换先建新、部署验证、再停旧；无需修改或重启 IAM，不使用已弃用的静态 token Map。
    iam-uri: ${dollar}{FORGE_IAM_URI}
    token: ${dollar}{FORGE_MANIFEST_TOKEN}
mybatis-plus:
  mapper-locations: classpath*:/*/mapper/**/*.xml
