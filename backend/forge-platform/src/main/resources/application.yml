server:
  port: ${FORGE_PLATFORM_PORT:8102}

spring:
  application:
    name: forge-platform
  config:
    import:
      - optional:nacos:forge-common.yaml
  cloud:
    nacos:
      server-addr: ${FORGE_NACOS_ADDR:127.0.0.1:8848}
  # 应用只用运行账号连接（仅数据读写、非表所有者），DDL 只由 Flyway 以迁移账号执行（ADR-0001）
  datasource:
    url: jdbc:postgresql://${FORGE_DB_HOST:127.0.0.1}:${FORGE_DB_PORT:5432}/forge
    username: platform_app
    password: ${FORGE_PLATFORM_DB_PASSWORD:platform_app}
  flyway:
    user: platform_migrator
    password: ${FORGE_PLATFORM_DB_MIGRATOR_PASSWORD:platform_migrator}
    schemas: platform
    default-schema: platform
    # schema 由 compose 初始化脚本创建并归属迁移账号，迁移账号本身没有建 schema 的权限
    create-schemas: false

forge:
  security:
    # 平台服务只接受 Platform Realm Token（ADR-0003），issuer 与 JWKS 读取 forge.security.platform.*
    realm: platform
    # 本地开发地址；代码中不设默认值，部署时以 Nacos 或环境变量覆盖，漏配则启动失败
    platform:
      issuer: http://localhost:8080/iam/platform
      jwk-set-uri: http://localhost:8101/platform/oauth2/jwks
  mq:
    endpoints: ${FORGE_ROCKETMQ_ENDPOINTS:127.0.0.1:8081}
  # 平台数据不属于任何租户。消费各服务的初始化回报时 SDK 会恢复该租户的上下文，这些表也不能被注入租户条件
  tenant:
    ignore-tables:
      - tenant
      - tenant_initialization
      - tenant_status_change
      - plan
      - sub_app
      - sub_app_entry
      - sub_app_requirement
  platform:
    provisioning:
      # 创建租户时预建 pending 初始化状态的服务，名称为各服务的 spring.application.name。
      # 未列出的服务回报时照常记录，只是在回报前平台不知道它需要初始化
      services:
        - forge-iam
        - demo-service
    # Feature Pack 从 iam 的权限码目录中选择。本地开发值，部署时以 Nacos 或环境变量覆盖，漏配则启动失败；
    # 令牌须与 iam forge.iam.manifest.tokens.forge-platform 一致
    iam:
      uri: http://localhost:8101
      token: ${FORGE_PLATFORM_MANIFEST_TOKEN:local-platform-manifest-token}
mybatis-plus:
  mapper-locations: classpath*:/*/mapper/**/*.xml
