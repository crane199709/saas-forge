# classpath:/config/application.yml 优先级高于主配置并与之合并：测试不依赖 Nacos，统一在这里关闭
spring:
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
# 不连接 MQ 的测试关闭投递器与消费端；发布的事件照常写入 Outbox
forge:
  mq:
    enabled: false
  # 测试不连接 iam；清单内容由 PlatformPermissionTest 直接生成校验
  manifest:
    enabled: false
