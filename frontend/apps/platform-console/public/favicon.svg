<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SaaS Forge 平台控制台">
  <!-- 识别块，不是品牌资产：主色取平台端 App.vue 实际应用的主色 themeTokens.primary，首字母取产品名 SaaS Forge。
       静态 SVG 不会跟随 applyTheme，换主色时需人工同步这个文件。 -->
  <rect width="32" height="32" rx="7" fill="#409eff" />
  <text
    x="16"
    y="22"
    text-anchor="middle"
    font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
    font-size="19"
    font-weight="700"
    fill="#ffffff"
  >S</text>
</svg>
