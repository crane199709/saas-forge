# 本地 HTTPS 基础设施；前端由独立仓库自行启动，不托管应用进程。
services:
  local-https-edge:
    image: node:24.14.1-alpine
    # Node 不会热加载挂载脚本；标签参与 Compose 哈希，避免复用尚未加载新路由的进程。
    labels:
      io.saas.forge.local-https.topology: platform-tenant-api-remote
      io.saas.forge.local-https.routing: tenant-password-setup-static-remote-v1
    user: node
    group_add:
      - "${SF_LOCAL_HTTPS_HOST_GID:?SF_LOCAL_HTTPS_HOST_GID is required}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["node", "/app/edge.mjs"]
    environment:
      SF_LOCAL_HTTPS_API_TARGET_FILE: /run/config/api-target.json
      SF_LOCAL_HTTPS_VITE_HOST: host.docker.internal
      SF_LOCAL_HTTPS_VITE_PORT: "5173"
      # 可在个人 override 中只读挂载独立准备的 Remote 验收制品；缺失时返回 404。
      SF_REMOTE_STATIC_DIRECTORY: /app/remote-artifacts
    ports:
      - "127.0.0.1:443:8443"
    volumes:
      - ./local-https-development/edge.mjs:/app/edge.mjs:ro
      - ./local-https-development/remote-static.mjs:/app/remote-static.mjs:ro
      - ./local-https-development/browser-security-evidence.mjs:/app/browser-security-evidence.mjs:ro
      - type: bind
        source: ${SF_LOCAL_HTTPS_API_TARGET_FILE:?SF_LOCAL_HTTPS_API_TARGET_FILE is required}
        target: /run/config/api-target.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SF_LOCAL_HTTPS_CERT:?SF_LOCAL_HTTPS_CERT is required}
        target: /run/secrets/server.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SF_LOCAL_HTTPS_KEY:?SF_LOCAL_HTTPS_KEY is required}
        target: /run/secrets/server.key
        read_only: true
        bind:
          create_host_path: false
