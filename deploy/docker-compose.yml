# 本地开发依赖。启动：docker compose -f deploy/docker-compose.yml up -d
# 数据卷统一挂在 deploy/data/（已被 .gitignore 忽略），删除该目录即可重置全部数据。
name: saas-forge

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: forge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${FORGE_PG_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      # 入口调用 lib/provision-service.sql；lib 子目录不会被镜像重复自动执行。
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forge"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.8.1
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${FORGE_REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  nacos:
    image: nacos/nacos-server:v3.1.1
    environment:
      MODE: standalone
      # Nacos 3 的控制台与管理 API 强制鉴权，以下密钥仅供本地开发。
      NACOS_AUTH_TOKEN: c2Fhcy1mb3JnZS1sb2NhbC1kZXYtb25seS1uYWNvcy10b2tlbi1zZWNyZXQ=
      NACOS_AUTH_IDENTITY_KEY: forge
      NACOS_AUTH_IDENTITY_VALUE: forge-local
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - "${FORGE_NACOS_PORT:-8848}:8848"
      - "${FORGE_NACOS_GRPC_PORT:-9848}:9848"
      - "${FORGE_NACOS_CONSOLE_PORT:-18080}:8080"
    volumes:
      - ./data/nacos:/home/nacos/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/v3/admin/core/state/liveness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40

  # 一次性任务：把 deploy/nacos/config/ 下的配置发布到 Nacos，重复执行会覆盖为仓库中的版本。
  nacos-init:
    image: curlimages/curl:8.12.1
    depends_on:
      nacos:
        condition: service_healthy
    environment:
      NACOS_ADDR: http://nacos:8848
      NACOS_ADMIN_PASSWORD: nacos
    volumes:
      - ./nacos:/nacos:ro
    entrypoint: ["sh", "/nacos/publish-config.sh"]
    restart: "no"

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    command: ["sh", "mqnamesrv"]
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    volumes:
      - ./data/rocketmq/namesrv/logs:/home/rocketmq/logs

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    command: ["sh", "mqbroker", "-n", "rocketmq-namesrv:9876", "-c", "/home/rocketmq/conf/forge-broker.conf"]
    depends_on:
      - rocketmq-namesrv
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/conf/forge-broker.conf:ro
      - ./data/rocketmq/broker/logs:/home/rocketmq/logs
      - ./data/rocketmq/broker/store:/home/rocketmq/store

  # rocketmq-client-java 只经 proxy 的 gRPC 端口通信（ADR-0012），因此只向宿主机暴露 8081。
  # 用独立的 cluster 模式 proxy：broker 内嵌的 local 模式会在路由中返回容器内 IP，宿主机上的服务连不上；
  # cluster 模式沿用客户端请求中的地址。启动时 broker 尚未注册到 namesrv 会直接退出，靠 restart 重试。
  rocketmq-proxy:
    image: apache/rocketmq:5.3.2
    command: ["sh", "mqproxy", "-n", "rocketmq-namesrv:9876", "-pc", "/home/rocketmq/conf/forge-proxy.json"]
    depends_on:
      - rocketmq-broker
    restart: on-failure
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    ports:
      - "${FORGE_ROCKETMQ_PROXY_PORT:-8081}:8081"
    volumes:
      - ./rocketmq/proxy.json:/home/rocketmq/conf/forge-proxy.json:ro
      - ./data/rocketmq/proxy/logs:/home/rocketmq/logs

  # 一次性任务：创建各服务的 Topic 并配置、验证消费组重试上限。gRPC 客户端拉取不存在的 Topic 路由会直接失败，消费端无法启动。
  rocketmq-init:
    image: apache/rocketmq:5.3.2
    environment:
      FORGE_MQ_MAX_DELIVERY_ATTEMPTS: "${FORGE_MQ_MAX_DELIVERY_ATTEMPTS:-16}"
      RETRY_MAX_TIMES: "${FORGE_ROCKETMQ_RETRY_MAX_TIMES:-16}"
      CONSUMER_GROUPS: "${FORGE_ROCKETMQ_CONSUMER_GROUPS:-forge-iam forge-platform demo-service}"
    depends_on:
      - rocketmq-broker
    volumes:
      - ./rocketmq/create-topics.sh:/home/rocketmq/create-topics.sh:ro
    entrypoint: ["sh", "/home/rocketmq/create-topics.sh"]
    restart: "no"

  # S3 兼容存储。MinIO 社区版已停止发布二进制（ADR-0011），本地使用其社区维护分支 silo，
  # 业务代码只依赖 S3 协议，可替换为任意 S3 兼容实现。
  s3:
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    command: ["silo", "server", "/data"]
    environment:
      MINIO_ROOT_USER: forge
      MINIO_ROOT_PASSWORD: forge-local-secret
    ports:
      - "${FORGE_S3_PORT:-9000}:9000"
    volumes:
      - ./data/s3:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 一次性任务：创建所有租户共用的 bucket（forge.storage.bucket），已存在时跳过。
  s3-init:
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: ["sh", "-c", "mc alias set local http://s3:9000 forge forge-local-secret && mc mb --ignore-existing local/forge"]
    restart: "no"
