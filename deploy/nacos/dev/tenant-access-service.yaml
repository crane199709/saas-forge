saas.forge:
  tenant-access:
    configuration-revision: "5"
    invitation:
      smtp:
        starttls: false
    outbox:
      publish-delay: PT1S
      lease-duration: PT30S
    initialization:
      recovery-delay: PT1S
      lease-duration: PT30S
      initial-backoff: PT1S
      maximum-backoff: PT1M
      maximum-attempts: 10
    password-setup:
      recovery-delay: PT1S

security:
  jwt:
    issuer: ${IAM_JWT_ISSUER:?IAM_JWT_ISSUER is required}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,nacosRegistrationReadiness

spring:
  grpc:
    client:
      channels:
        iam:
          default-deadline: PT3S
        entitlement:
          default-deadline: PT3S
  nacos:
    config:
      health-indicator:
        enabled: true
  cloud:
    nacos:
      discovery:
        health-indicator:
          enabled: true
    discovery:
      client:
        health-indicator:
          use-services-query: false
