forge:
  # Business Time Zone：全平台统一，用于业务日期（Business Number 的日期段与计数周期、定时任务的 cron）。
  # 代码中不设默认值，用到业务日期的服务漏配时启动失败
  business-zone: Asia/Shanghai

spring:
  cloud:
    refresh:
      # 租户包装后的数据源不再匹配 Hikari 默认排除项，重新绑定会与原工厂方法的返回类型冲突。
      never-refreshable: com.zaxxer.hikari.HikariDataSource,io.saasforge.sdk.tenant.TenantSessionDataSource

server:
  # 经网关访问时按 X-Forwarded-* 还原外部地址，springdoc 生成的 servers 才会指向网关而不是服务本机端口
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  # 第一期不搭建采集后端：trace 在设置 management.opentelemetry.tracing.export.otlp.endpoint 后才导出，
  # 指标在设置 management.otlp.metrics.export.enabled=true 与 url 后才推送（SDK 与网关默认关闭）。
  # 本地开发全量采样，便于按 traceId 查看完整链路；生产按流量调低。
  tracing:
    sampling:
      probability: 1.0
