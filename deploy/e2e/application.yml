# 主链路只依赖 DB、Redis 和 HTTP。MQ/发现另有集成测试；认证、权限、RLS 均保持开启。
spring:
  cloud:
    discovery:
      client:
        simple:
          instances:
            forge-iam:
              - uri: http://127.0.0.1:18101
            forge-platform:
              - uri: http://127.0.0.1:18102
            demo-service:
              - uri: http://127.0.0.1:18201
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
    gateway:
      server:
        webflux:
          routes:
            - id: iam
              uri: http://127.0.0.1:18101
              predicates: [Path=/iam/**]
              filters: [StripPrefix=1]
            - id: platform
              uri: http://127.0.0.1:18102
              predicates: [Path=/platform/**]
              filters: [StripPrefix=1]
            - id: demo
              uri: http://127.0.0.1:18201
              predicates: [Path=/demo/**]
              filters: [StripPrefix=1]
server:
  address: 127.0.0.1
  forward-headers-strategy: framework
forge:
  # E2E 不连接 Nacos，在此提供共享配置 forge-common.yaml 中的 Business Time Zone
  business-zone: Asia/Shanghai
  gateway:
    services:
      - prefix: /iam
        realm: tenant
      - prefix: /platform
        realm: platform
      - prefix: /demo
        realm: tenant
  mq:
    enabled: false
  security:
    issuer: http://127.0.0.1:18000/iam
    jwk-set-uri: http://127.0.0.1:18101/oauth2/jwks
    platform:
      issuer: http://127.0.0.1:18000/iam/platform
      jwk-set-uri: http://127.0.0.1:18101/platform/oauth2/jwks
  iam:
    # 仅隔离 E2E 使用静态引导凭证，不依赖应用自带默认密钥。
    manifest:
      tokens:
        demo-service: local-demo-manifest-token
        forge-platform: local-platform-manifest-token
    redirect-uri: http://127.0.0.1:15174/
  manifest:
    iam-uri: http://127.0.0.1:18101
  reference-data:
    iam-uri: http://127.0.0.1:18101
  platform:
    onboarding:
      gateway-uri: http://127.0.0.1:18000
    iam:
      uri: http://127.0.0.1:18101
