openapi: 3.1.1
info:
  title: saas-forge Public API
  version: 1.0.0
  description: |
    The versioned public REST contract for saas-forge. This document contains only
    delivery-stage-two and delivery-stage-three resources. Permission, Feature,
    and Quota runtime operations are intentionally absent until their domain
    contracts are reviewed.
servers:
  - url: https://api.example.invalid
    description: Deployment-specific API Gateway origin.
tags:
  - name: Authentication
  - name: Discovery
  - name: Platform tenants
  - name: Platform entitlement bootstrap
  - name: OAuth clients
paths:
  /api/v1/auth/session:
    get:
      tags: [Authentication]
      operationId: getCurrentSession
      x-saas.forge-service: iam-service
      summary: Read the current Platform Identity and authorization
      description: |
        Uses only a verified Platform User Access Token. Reads authoritative IAM
        Identity and current PLATFORM_ADMIN authorization, independently of future
        business authorization. Tenant and Service Access Tokens are rejected.
        Does not consume, validate or rotate a Refresh Token Family and does not
        promise that future refresh will succeed. Never sets cookies.
      security: [{ UserBearerAuth: [] }]
      responses:
        '200':
          description: Current request identity and authorization; never cached.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentSession' }
        '401': { $ref: './common.yaml#/components/responses/Problem' }
        '403': { $ref: './common.yaml#/components/responses/Problem' }
        '405': { $ref: './common.yaml#/components/responses/Problem' }
        '502': { $ref: './common.yaml#/components/responses/Problem' }
        '503': { $ref: './common.yaml#/components/responses/Problem' }
        '504': { $ref: './common.yaml#/components/responses/Problem' }

  /api/v1/auth/context:
    get:
      tags: [Authentication]
      operationId: getCurrentTenantContext
      x-saas.forge-service: iam-service
      x-saas.forge-java-sdk: true
      summary: Read the current Tenant Context without rotating the browser session
      description: |
        Uses only the verified User Access Token to select the current Membership and Tenant.
        Returns the authoritative Accessible Membership and brand snapshot for this tab.
        Does not accept a client-selected Tenant, consume a Refresh Token or set cookies.
        Platform and Service Access Tokens cannot read a Tenant Context.
      security: [{ UserBearerAuth: [] }]
      responses:
        '200':
          description: Current Tenant Context; never cached.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantAuthenticationContext' }
        '401': { $ref: './common.yaml#/components/responses/Problem' }
        '403': { $ref: './common.yaml#/components/responses/Problem' }
        '409': { $ref: './common.yaml#/components/responses/Problem' }
        '503': { $ref: './common.yaml#/components/responses/Problem' }
        '405': { $ref: './common.yaml#/components/responses/Problem' }
        '502': { $ref: './common.yaml#/components/responses/Problem' }
        '504': { $ref: './common.yaml#/components/responses/Problem' }

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      x-saas.forge-service: iam-service
      summary: Start a browser session with email and password
      description: |
        The request never accepts a Tenant or Membership identifier. A user with one
        accessible Membership receives an Access Token; a user with multiple
        Memberships receives the server-verified selection candidates without an
        Access Token. A Refresh Token is set only as an HttpOnly cookie. The deprecated
        Idempotency-Key parameter remains optional for v1 compatibility and is ignored.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          deprecated: true
          description: Retained only for v1 compatibility; login does not use it.
          schema: { $ref: './common.yaml#/components/schemas/UuidV7' }
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/BrowserOrigin'
        - $ref: '#/components/parameters/FetchSite'
        - $ref: '#/components/parameters/OptionalPlatformRefreshTokenCookie'
        - $ref: '#/components/parameters/OptionalTenantRefreshTokenCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResult'
        '400': { $ref: './common.yaml#/components/responses/ValidationProblem' }
        '401': { $ref: './common.yaml#/components/responses/Problem' }
        '403': { $ref: './common.yaml#/components/responses/Problem' }
        '409': { $ref: './common.yaml#/components/responses/Problem' }
        '404': { $ref: './common.yaml#/components/responses/Problem' }
        '405': { $ref: './common.yaml#/components/responses/Problem' }
        '502': { $ref: './common.yaml#/components/responses/Problem' }
        '503': { $ref: './common.yaml#/components/responses/Problem' }
        '504': { $ref: './common.yaml#/components/responses/Problem' }

  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshAccessToken
      x-saas.forge-service: iam-service
      security:
        - PlatformRefreshCookieAuth: []
        - TenantRefreshCookieAuth: []
      summary: Rotate the browser Refresh Token and issue the current Access Token
      description: The Refresh Token is supplied only by the HttpOnly refresh cookie.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/BrowserOrigin'
        - $ref: '#/components/parameters/FetchSite'
        - $ref: '#/components/parameters/OptionalPlatformRefreshTokenCookie'
        - $ref: '#/components/parameters/OptionalTenantRefreshTokenCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionSlotRequest'
      responses:
        '200':
          description: The Refresh Token was rotated.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResult'
        '400': { $ref: './common.yaml#/components/responses/ValidationProblem' }
        '401': { $ref: './common.yaml#/components/responses/Problem' }
        '409': { $ref: './common.yaml#/components/responses/Problem' }
        '404': { $ref: './common.yaml#/components/responses/Problem' }
        '405': { $ref: './common.yaml#/components/responses/Problem' }
        '502': { $ref: './common.yaml#/components/responses/Problem' }
        '503': { $ref: './common.yaml#/components/responses/Problem' }
        '504': { $ref: './common.yaml#/components/responses/Problem' }

  /api/v1/auth/password-changes:
    post:
      tags: [Authentication]
      operationId: changeInitialPassword
      x-saas.forge-service: iam-service
      security: [{ PlatformRefreshCookieAuth: [] }]
      summary: Replace an initial password and end the restricted session
      description: |
        Accepts only an INITIAL_PASSWORD_CHANGE Refresh Token cookie. A successful
        change revokes the restricted session and requires a new login.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/BrowserOrigin'
        - $ref: '#/components/parameters/FetchSite'
        - $ref: '#/components/parameters/PlatformRefreshTokenCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: The password was changed and the restricted session ended.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearedRefreshCookie'
        '400': { $ref: './common.yaml#/components/responses/ValidationProblem' }
        '401': { $ref: './common.yaml#/components/responses/Problem' }
        '404': { $ref: './common.yaml#/components/responses/Problem' }
        '405': { $ref: './common.yaml#/components/responses/Problem' }
        '503': { $ref: './common.yaml#/components/responses/Problem' }

  /api/v1/auth/password-setups:
    post:
      tags: [Authentication]
      operationId: establishPassword
      x-saas.forge-service: iam-service
      summary: Establish the first Password Credential with a one-time Challenge
      description: |
        This anonymous endpoint accepts no Identity, Tenant, Membership, or email.
        A successful exchange never creates a login session or sets a cookie.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordSetupRequest'
      responses:
        '204': { $ref: './common.yaml#/components/responses/NoContent' }
        '400': { $ref: './common.yaml#/components/responses/Problem' }
        '405': { $ref: './common.yaml#/components/responses/Problem' }
        '503': { $ref: './common.yaml#/components/responses/Problem' }

  /api/v1/auth/context-selections:
    post:
      tags: [Authentication]
      operationId: selectAuthenticationContext
      x-saas.forge-service: iam-service
      security: [{ TenantRefreshCookieAuth: [] }]
      summary: Complete a pending Tenant context selection
      description: |
        The Identity comes only from the USER_TENANT_SELECTION Refresh Token cookie.
        IAM revalidates the selected Membership with Tenant Access before atomically
        rotating the cookie and issuing a Tenant Access Token.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/BrowserOrigin'
        - $ref: '#/components/parameters/FetchSite'
        - $ref: '#/components/parameters/TenantRefreshTokenCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextSelectionRequest'
      responses:
        '200':
          description: The pending selection became a Tenant session.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResult'
        '400': { $ref: './common.yaml#/components/responses/ValidationProblem' }
        '401': { $ref: './common.yaml#/components/responses/Problem' }
        '403': { $ref: './common.yaml#/components/responses/Problem' }
        '405': { $ref: './common.yaml#/components/responses/Problem' }
        '503': { $ref: './common.yaml#/components/responses/Problem' }

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      x-saas.forge-service: iam-service
      summary: Revoke the browser Refresh Token
      description: |
        Idempotently ends only the current browser session. The Refresh Token cookie is optional so
        clients can safely retry after the cookie was already cleared. When a valid User bearer token
        is present, IAM also revokes that token's jti for its remaining validity window plus clock skew.
      security:
        - UserBearerAuth: []
        - {}
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          deprecated: true
          description: Retained only for v1 compatibility; logout does not use it.
          schema: { $ref: './common.yaml#/components/schemas/UuidV7' }
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/BrowserOrigin'
        - $ref: '#/components/parameters/FetchSite'
        - $ref: '#/components/parameters/OptionalPlatformRefreshTokenCookie'
        - $ref: '#/components/parameters/OptionalTenantRefreshTokenCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionSlotRequest'
      responses:
        '204':
          description: The current browser session was logged out.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearedRefreshCookie'
        '400': { $ref: './common.yaml#/components/responses/ValidationProblem' }
        '401': { $ref: './common.yaml#/components/responses/Problem' }
        '409': { $ref: './common.yaml#/components/responses/Problem' }
        '404': { $ref: './common.yaml#/components/responses/Problem' }
        '405': { $ref: './common.yaml#/components/responses/Problem' }
        '502': { $ref: './common.yaml#/components/responses/Problem' }
        '503': { $ref: './common.yaml#/components/responses/Problem' }
        '504': { $ref: './common.yaml#/components/responses/Problem' }

  /api/v1/auth/tenant-switches:
    post:
      tags: [Authentication]
      operationId: switchTenantContext
      x-saas.forge-service: iam-service
      security: [{ TenantRefreshCookieAuth: [] }]
      summary: Select or switch the session Membership
      description: |
        Accepts only the target Membership. The host-only Refresh Token cookie is the
        only session locator; a Bearer Access Token is ignored for this purpose. IAM
        verifies the current and target Membership before changing the session. The
        request must originate from a controlled browser Origin and pass Fetch Metadata
        and CSRF checks. Call refresh after 204.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/BrowserOrigin'
        - $ref: '#/components/parameters/FetchSite'
        - $ref: '#/components/parameters/TenantRefreshTokenCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantSwitchRequest'
      responses:
        '204': { $ref: './common.yaml#/components/responses/NoContent' }
        '400': { $ref: './common.yaml#/components/responses/ValidationProblem' }
        '401': { $ref: './common.yaml#/components/responses/Problem' }
        '403': { $ref: './common.yaml#/components/responses/Problem' }
        '409': { $ref: './common.yaml#/components/responses/Problem' }
        '503': { $ref: './common.yaml#/components/responses/Problem' }

  /oauth2/token:
    post:
      tags: [Authentication]
      operationId: issueClientCredentialsToken
      x-saas.forge-service: iam-service
      x-saas.forge-java-sdk: true
      summary: Issue a Client Credentials Access Token
      description: |
        Supports only grant_type=client_credentials. The OAuth Client authenticates
        with HTTP Basic; requested scope must be a subset of its allowedScopes.
      security:
        - OAuthClientBasic: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClientCredentialsTokenRequest'
      responses:
        '200':
          description: A service Access Token was issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientCredentialsTokenResponse'
        '400': { $ref: './common.yaml#/components/responses/ValidationProblem' }
        '401': { $ref: './common.yaml#/components/responses/Problem' }
        '403': { $ref: './common.yaml#/components/responses/Problem' }
        '404': { $ref: './common.yaml#/components/responses/Problem' }
        '405': { $ref: './common.yaml#/components/responses/Problem' }
        '502': { $ref: './common.yaml#/components/responses/Problem' }
        '504': { $ref: './common.yaml#/components/responses/Problem' }

  /.well-known/jwks.json:
    get:
      tags: [Discovery]
      operationId: getJwks
      x-saas.forge-service: iam-service
      x-saas.forge-java-sdk: true
      summary: Get current JWT verification keys
      description: Anonymous RS256 verification-key discovery. Private material and internal signing-key metadata are never published.
      responses:
        '200':
          description: Current public signing keys.
          headers:
            Cache-Control:
              $ref: '#/components/headers/JwksCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'
        '404': { $ref: './common.yaml#/components/responses/Problem' }
        '405': { $ref: './common.yaml#/components/responses/Problem' }
        '502': { $ref: './common.yaml#/components/responses/Problem' }
        '504': { $ref: './common.yaml#/components/responses/Problem' }

  /api/v1/platform/tenants:
    get:
      tags: [Platform tenants]
      operationId: listPlatformTenants
      x-saas.forge-service: tenant-access-service
      summary: List Tenants by literal name substring and lifecycle status
      security: [{ UserBearerAuth: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string, maxLength: 2048 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: name
          in: query
          schema: { type: string, maxLength: 200 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TenantStatus' }
      responses:
        '200':
          description: Authoritative result; requires current Platform Admin authorization.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantPage' }
        '400': { $ref: './common.yaml#/components/responses/ValidationProblem' }
        '401': { $ref: './common.yaml#/components/responses/Problem' }
        '403': { $ref: './common.yaml#/components/responses/Problem' }
        '404': { $ref: './common.yaml#/components/responses/Problem' }
        '405': { $ref: './common.yaml#/components/responses/Problem' }
        '409': { $ref: './common.yaml#/components/responses/Problem' }
        '502': { $ref: './common.yaml#/components/responses/Problem' }
        '503': { $ref: './common.yaml#/components/responses/Problem' }
        '504': { $ref: './common.yaml#/components/responses/Problem' }
    post:
      tags: [Platform tenants]
      operationId: createPlatformTenant
      x-saas.forge-service: tenant-access-service
      x-saas.forge-java-sdk: true
      summary: Create a pending Tenant
      description: Requires a Platform Admin user token. The new Tenant is PENDING until administrator initialization succeeds.
      security: [{ UserBearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: The Tenant was created in PENDING state.
          headers:
            Location: { $ref: './common.yaml#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '400': { $ref: './common.yaml#/components/responses/ValidationProblem' }
        '401': { $ref: './common.yaml#/components/responses/Problem' }
        '403': { $ref: './common.yaml#/components/responses/Problem' }
        '409': { $ref: './common.yaml#/components/responses/Problem' }
        '404': { $ref: './common.yaml#/components/responses/Problem' }
        '405': { $ref: './common.yaml#/components/responses/Problem' }
        '502': { $ref: './common.yaml#/components/responses/Problem' }
        '504': { $ref: './common.yaml#/components/responses/Problem' }

  /api/v1/platform/tenants/{tenantId}:
    get:
      tags: [Platform tenants]
      operationId: getPlatformTenant
      x-saas.forge-service: tenant-access-service
      summary: Read authoritative Tenant detail
      security: [{ UserBearerAuth: [] }]
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { $ref: './common.yaml#/components/schemas/UuidV7' }
      responses:
        '200':
          description: Authoritative result; requires current Platform Admin authorization.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '400': { $ref: './common.yaml#/components/responses/ValidationProblem' }
        '401': { $ref: './common.yaml#/components/responses/Problem' }
        '403': { $ref: './common.yaml#/components/responses/Problem' }
        '404': { $ref: './common.yaml#/components/responses/Problem' }
        '405': { $ref: './common.yaml#/components/responses/Problem' }
        '409': { $ref: './common.yaml#/components/responses/Problem' }
        '502': { $ref: './common.yaml#/components/responses/Problem' }
        '503': { $ref: './common.yaml#/components/responses/Problem' }
        '504': { $ref: './common.yaml#/components/responses/Problem' }

  /api/v1/platform/tenant-creations:
    get:
      tags: [Platform tenants]
      operationId: listTenantCreations
      x-saas.forge-service: tenant-access-service
      summary: Find only the current actor creation attempts after losing an in-memory handle
      security: [{ UserBearerAuth: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string, maxLength: 2048 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Authoritative result; requires current Platform Admin authorization.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantCreationPage' }
        '400': { $ref: './common.yaml#/components/responses/ValidationProblem' }
        '401': { $ref: './common.yaml#/components/responses/Problem' }
        '403': { $ref: './common.yaml#/components/responses/Problem' }
        '404': { $ref: './common.yaml#/components/responses/Problem' }
        '405': { $ref: './common.yaml#/components/responses/Problem' }
        '409': { $ref: './common.yaml#/components/responses/Problem' }
        '502': { $ref: './common.yaml#/components/responses/Problem' }
        '503': { $ref: './common.yaml#/components/responses/Problem' }
        '504': { $ref: './common.yaml#/components/responses/Problem' }

  /api/v1/platform/tenant-creations/{creationId}:
    get:
      tags: [Platform tenants]
      operationId: getTenantCreation
      x-saas.forge-service: tenant-access-service
      summary: Read own creation result; missing or expired records never authorize a new creation
      security: [{ UserBearerAuth: [] }]
      parameters:
        - name: creationId
          in: path
          required: true
          schema: { $ref: './common.yaml#/components/schemas/UuidV7' }
      responses:
        '200':
          description: Authoritative result; requires current Platform Admin authorization.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantCreationRecovery' }
        '400': { $ref: './common.yaml#/components/responses/ValidationProblem' }
        '401': { $ref: './common.yaml#/components/responses/Problem' }
        '403': { $ref: './common.yaml#/components/responses/Problem' }
        '404': { $ref: './common.yaml#/components/responses/Problem' }
        '405': { $ref: './common.yaml#/components/responses/Problem' }
        '409': { $ref: './common.yaml#/components/responses/Problem' }
        '502': { $ref: './common.yaml#/components/responses/Problem' }
        '503': { $ref: './common.yaml#/components/responses/Problem' }
        '504': { $ref: './common.yaml#/components/responses/Problem' }

  /api/v1/platform/tenant-creations/{creationId}/recovery:
    post:
      tags: [Platform tenants]
      operationId: recoverTenantCreation
      x-saas.forge-service: tenant-access-service
      summary: Continue the original creation with its server-stored actor, Key and request; never starts a new operation
      security: [{ UserBearerAuth: [] }]
      parameters:
        - name: creationId
          in: path
          required: true
          schema: { $ref: './common.yaml#/components/schemas/UuidV7' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      responses:
        '200':
          description: Authoritative result; requires current Platform Admin authorization.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantCreationRecovery' }
        '400': { $ref: './common.yaml#/components/responses/ValidationProblem' }
        '401': { $ref: './common.yaml#/components/responses/Problem' }
        '403': { $ref: './common.yaml#/components/responses/Problem' }
        '404': { $ref: './common.yaml#/components/responses/Problem' }
        '405': { $ref: './common.yaml#/components/responses/Problem' }
        '409': { $ref: './common.yaml#/components/responses/Problem' }
        '502': { $ref: './common.yaml#/components/responses/Problem' }
        '503': { $ref: './common.yaml#/components/responses/Problem' }
        '504': { $ref: './common.yaml#/components/responses/Problem' }

  /api/v1/platform/tenants/{tenantId}/administrator-initialization:
    get:
      tags: [Platform tenants]
      operationId: getTenantAdministratorInitialization
      x-saas.forge-service: tenant-access-service
      summary: Read initialization business progress and the historical initial Membership
      description: |
        Requires current Platform Admin authorization. Does not expose administrator email,
        internal execution state, leases or recovery keys. canContinue is true only for
        the original actor when explicit recovery is available. No 24 hour expiration.
        canStart does not certify Subscription or Quota eligibility.
      security: [{ UserBearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Authoritative Tenant Access observation.
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
