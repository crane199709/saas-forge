components:
  securitySchemes:
    UserBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Platform Admin user Access Token. OAuth Client tokens cannot access platform management operations.
    OAuthClientBasic:
      type: http
      scheme: basic
      description: OAuth Client client_id and client_secret.
    PlatformRefreshCookieAuth:
      type: apiKey
      in: cookie
      name: __Host-sf_platform_refresh
      description: Platform Browser Session Slot Refresh Token cookie used only by IAM session operations.
    TenantRefreshCookieAuth:
      type: apiKey
      in: cookie
      name: __Host-sf_tenant_refresh
      description: Tenant Browser Session Slot Refresh Token cookie used only by IAM session operations.
    ServiceOAuth2:
      type: oauth2
      description: Service Access Token issued through OAuth 2.0 Client Credentials.
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes:
            remote-delivery:manifest:register: Register an assigned module manifest
            runtime:read: Read runtime entitlement state.
            runtime:quota:write: Apply runtime quota operations.
  headers:
    RefreshCookie:
      description: A rotated slot-specific HttpOnly, Secure, SameSite=Strict host-only cookie scoped to Path=/.
      required: true
      schema: { type: string }
    ClearedRefreshCookie:
      description: One or more expired slot-specific or legacy Refresh Token cookies with Path=/.
      required: true
      schema: { type: string }
    JwksCacheControl:
      description: JWKS cache policy.
      required: true
      schema:
        type: string
        const: max-age=300
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { $ref: './common.yaml#/components/schemas/UuidV7' }
    CsrfHeader:
      name: X-SF-CSRF
      in: header
      required: true
      schema:
        type: string
        const: '1'
    BrowserOrigin:
      name: Origin
      in: header
      required: true
      description: Must exactly match the configured platform or tenant console HTTPS Origin.
      schema:
        type: string
        format: uri
    FetchSite:
      name: Sec-Fetch-Site
      in: header
      required: false
      description: When supplied by the browser, cross-site is rejected; absence still requires an exact Origin match.
      schema:
        type: string
        enum: [same-origin, same-site, none]
    PlatformRefreshTokenCookie:
      name: __Host-sf_platform_refresh
      in: cookie
      required: true
      schema:
        type: string
        minLength: 1
    TenantRefreshTokenCookie:
      name: __Host-sf_tenant_refresh
      in: cookie
      required: true
      schema:
        type: string
        minLength: 1
    OptionalPlatformRefreshTokenCookie:
      name: __Host-sf_platform_refresh
      in: cookie
      required: false
      schema:
        type: string
        minLength: 1
    OptionalTenantRefreshTokenCookie:
      name: __Host-sf_tenant_refresh
      in: cookie
      required: false
      schema:
        type: string
        minLength: 1
    TenantId:
      name: tenantId
      in: path
      required: true
      schema: { $ref: './common.yaml#/components/schemas/UuidV7' }
    QuotaDefinitionId:
      name: quotaDefinitionId
      in: path
      required: true
      schema: { $ref: './common.yaml#/components/schemas/UuidV7' }
    PlanId:
      name: planId
      in: path
      required: true
      schema: { $ref: './common.yaml#/components/schemas/UuidV7' }
    ClientId:
      name: clientId
      in: path
      required: true
      schema: { $ref: './common.yaml#/components/schemas/UuidV7' }
  schemas:
    CurrentSession:
      type: object
      additionalProperties: false
      required: [identityId, email, platformAdmin]
      properties:
        identityId: { $ref: './common.yaml#/components/schemas/UuidV7' }
        email: { type: string, format: email }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        platformAdmin:
          type: boolean
          description: Current active PLATFORM_ADMIN assignment; not a grant for any later operation.
    Timestamp:
      type: string
      format: date-time
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[.][0-9]{3}Z$'
    Email:
      type: string
      format: email
      minLength: 3
      maxLength: 320
    EmptyRequest:
      type: object
      additionalProperties: false
    SessionSlotRequest:
      type: object
      required: [sessionSlot]
      properties:
        sessionSlot:
          type: string
          enum: [PLATFORM, TENANT]
      additionalProperties: false
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        password:
          type: string
          format: password
          minLength: 1
          writeOnly: true
        contextType:
          type: string
          enum: [PLATFORM, TENANT]
          default: TENANT
      additionalProperties: false
    PasswordChangeRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          format: password
          minLength: 1
          writeOnly: true
      additionalProperties: false
    TenantLifecycle:
      type: object
      required: [tenantId, state, canSuspend, canResume, canRecoverSuspension, canContinue]
      properties:
        tenantId: { $ref: './common.yaml#/components/schemas/UuidV7' }
        operationId: { $ref: './common.yaml#/components/schemas/UuidV7' }
        action: { type: string, enum: [SUSPEND, RESUME] }
        state: { type: string, enum: [NONE, PENDING, COMPLETED, RETRY_REQUIRED, RECOVERY_REQUIRED] }
        canSuspend: { type: boolean }
        canResume: { type: boolean }
        canRecoverSuspension: { type: boolean }
        canContinue: { type: boolean }
      additionalProperties: false
    PasswordSetupRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          writeOnly: true
        newPassword:
          type: string
          format: password
          minLength: 1
          writeOnly: true
      additionalProperties: false
    AccessTokenResult:
      type: object
      required: [contextState, accessToken, tokenType, expiresIn]
      properties:
        contextState: { const: ACCESS_TOKEN_ISSUED }
        accessToken: { type: string, minLength: 1 }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, format: int64, minimum: 1 }
        tenantContext:
          $ref: '#/components/schemas/TenantAuthenticationContext'
      additionalProperties: false
    MembershipCandidate:
      type: object
      required: [membershipId, tenantId, tenantDisplayName]
      properties:
        membershipId: { $ref: './common.yaml#/components/schemas/UuidV7' }
        tenantId: { $ref: './common.yaml#/components/schemas/UuidV7' }
        tenantDisplayName: { type: string, minLength: 1, maxLength: 200 }
      additionalProperties: false
    TenantAuthenticationContext:
      type: object
      required:
        [membershipId, tenantId, tenantDisplayName, accessibleMemberships]
      properties:
        membershipId: { $ref: './common.yaml#/components/schemas/UuidV7' }
        tenantId: { $ref: './common.yaml#/components/schemas/UuidV7' }
        tenantDisplayName: { type: string, minLength: 1, maxLength: 200 }
        accessibleMemberships:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/MembershipCandidate' }
        brandProfile:
          $ref: '#/components/schemas/TenantBrandProfile'
      additionalProperties: false
    TenantBrandProfile:
      type: object
      required: [displayName, primaryColor, accentColor]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 200 }
        logoUrl: { type: string, minLength: 1, maxLength: 2048 }
        faviconUrl: { type: string, minLength: 1, maxLength: 2048 }
        primaryColor: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        accentColor: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
      additionalProperties: false
    ContextSelectionRequiredResult:
      type: object
      required: [contextState, memberships]
      properties:
        contextState: { const: CONTEXT_SELECTION_REQUIRED }
        memberships:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/MembershipCandidate' }
      additionalProperties: false
    InitialPasswordChangeRequiredResult:
      type: object
      required: [contextState]
      properties:
        contextState: { const: PASSWORD_CHANGE_REQUIRED }
      additionalProperties: false
    ContextSelectionRequest:
      type: object
      required: [membershipId]
      properties:
        membershipId: { $ref: './common.yaml#/components/schemas/UuidV7' }
      additionalProperties: false
    AuthenticationResult:
      oneOf:
        - $ref: '#/components/schemas/AccessTokenResult'
        - $ref: '#/components/schemas/ContextSelectionRequiredResult'
        - $ref: '#/components/schemas/InitialPasswordChangeRequiredResult'
    TenantSwitchRequest:
      type: object
      required: [membershipId]
      properties:
        membershipId: { $ref: './common.yaml#/components/schemas/UuidV7' }
      additionalProperties: false
    ClientCredentialsTokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type: { type: string, const: client_credentials }
        scope:
          type: string
          description: Space-delimited requested scopes, each of which must have been granted to the OAuth Client.
      additionalProperties: false
    ClientCredentialsTokenResponse:
      type: object
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token: { type: string, minLength: 1 }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, minimum: 1 }
        scope:
          type: string
          description: Space-delimited scopes granted to this token.
      additionalProperties: false
    Jwk:
      type: object
      required: [kty, use, alg, kid, n, e]
      properties:
        kty: { type: string, const: RSA }
        use: { type: string, const: sig }
        alg: { type: string, const: RS256 }
        kid: { type: string, minLength: 1 }
        n: { type: string, minLength: 1, description: Base64url-encoded RSA modulus. }
        e: { type: string, minLength: 1, description: Base64url-encoded RSA public exponent. }
      additionalProperties: false
    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Jwk' }
      additionalProperties: false
    PlanPage:
      allOf:
        - $ref: './common.yaml#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Plan' }
            nextCursor:
              oneOf:
                - type: string
                - type: 'null'
            hasMore: { type: boolean }
    TenantSubscription:
      type: object
      required: [observedAt, subscription, effective, maxUsersLimit, maxUsersUsed]
      properties:
        observedAt: { $ref: '#/components/schemas/Timestamp' }
        subscription:
          oneOf:
            - $ref: '#/components/schemas/Subscription'
            - type: 'null'
        effective: { type: boolean, description: Subscription validity at observedAt; does not certify Tenant eligibility. }
        maxUsersLimit:
          type: [integer, 'null']
          minimum: 0
          description: Granted limit including historical zero; null only without Subscription.
        maxUsersUsed:
          type: [integer, 'null']
          minimum: 0
          description: Authoritative cumulative usage; an absent usage row is zero under Entitlement rules. Null only without Subscription.
      additionalProperties: false
    SubscriptionOperationPage:
      allOf:
        - $ref: './common.yaml#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/SubscriptionOperationRecovery' }
            nextCursor:
              oneOf:
                - type: string
                - type: 'null'
            hasMore: { type: boolean }
    SubscriptionOperationRecovery:
      type: object
      description: Actor-private recovery material. Shared Runtime owns idempotencyKey. NOT_COMMITTED is a point-in-time observation, never authorization to create with a new key. UNKNOWN requires manual verification. Committed result remains known after replay retention ends.
      required: [id, tenantId, state, createdAt, replayUntil, canReplay]
      properties:
        id: { $ref: './common.yaml#/components/schemas/UuidV7' }
        tenantId: { $ref: './common.yaml#/components/schemas/UuidV7' }
        state: { type: string, enum: [COMMITTED, PROCESSING, NOT_COMMITTED, UNKNOWN] }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        replayUntil: { $ref: '#/components/schemas/Timestamp' }
        canReplay: { type: boolean }
        subscriptionId: { $ref: './common.yaml#/components/schemas/UuidV7' }
        idempotencyKey: { $ref: './common.yaml#/components/schemas/UuidV7' }
      additionalProperties: false
    PlanOperationPage:
      allOf:
        - $ref: './common.yaml#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/PlanOperationRecovery' }
            nextCursor:
              oneOf:
                - type: string
                - type: 'null'
            hasMore: { type: boolean }
    PlanOperationRecovery:
      type: object
      description: Actor-private recovery material. Shared Runtime owns idempotencyKey. NOT_COMMITTED is a point-in-time observation, never authorization to create with a new key. UNKNOWN requires manual verification. Committed result remains known after replay retention ends.
      required: [id, operation, state, createdAt, replayUntil, canReplay]
      properties:
        id: { $ref: './common.yaml#/components/schemas/UuidV7' }
        operation: { type: string, enum: [CREATE, ACTIVATE] }
        state: { type: string, enum: [COMMITTED, PROCESSING, NOT_COMMITTED, UNKNOWN] }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        replayUntil: { $ref: '#/components/schemas/Timestamp' }
        canReplay: { type: boolean }
        code: { type: string, description: Original Plan code for CREATE; used to guard only that logical creation. }
        planId: { $ref: './common.yaml#/components/schemas/UuidV7' }
        result: { $ref: '#/components/schemas/Plan' }
        idempotencyKey: { $ref: './common.yaml#/components/schemas/UuidV7' }
      additionalProperties: false
    QuotaDefinitionPage:
      allOf:
        - $ref: './common.yaml#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/QuotaDefinition' }
            nextCursor:
              oneOf:
                - type: string
                - type: 'null'
            hasMore: { type: boolean }
    QuotaDefinitionOperationPage:
      allOf:
        - $ref: './common.yaml#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/QuotaDefinitionOperationRecovery' }
            nextCursor:
              oneOf:
                - type: string
                - type: 'null'
            hasMore: { type: boolean }
    QuotaDefinitionOperationRecovery:
      type: object
      description: Actor-private recovery material. Shared Runtime owns idempotencyKey. NOT_COMMITTED is a point-in-time observation, never authorization to create with a new key. UNKNOWN requires manual verification. Committed result remains known after replay retention ends.
      required: [id, operation, state, createdAt, replayUntil, canReplay]
      properties:
        id: { $ref: './common.yaml#/components/schemas/UuidV7' }
        operation: { type: string, enum: [CREATE, ACTIVATE] }
        state: { type: string, enum: [COMMITTED, PROCESSING, NOT_COMMITTED, UNKNOWN] }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        replayUntil: { $ref: '#/components/schemas/Timestamp' }
        canReplay: { type: boolean }
        quotaDefinitionId: { $ref: './common.yaml#/components/schemas/UuidV7' }
        idempotencyKey: { $ref: './common.yaml#/components/schemas/UuidV7' }
      additionalProperties: false
    TenantPage:
      allOf:
        - $ref: './common.yaml#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Tenant' }
            nextCursor:
              oneOf:
                - type: string
                - type: 'null'
            hasMore: { type: boolean }
    TenantCreationPage:
      allOf:
        - $ref: './common.yaml#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/TenantCreationRecovery' }
            nextCursor:
              oneOf:
                - type: string
                - type: 'null'
            hasMore: { type: boolean }
    TenantCreationRecovery:
      type: object
      description: Actor-private recovery material. Shared Runtime owns idempotencyKey. NOT_COMMITTED is a point-in-time observation, never authorization to create with a new key. UNKNOWN requires manual verification. Committed result remains known after replay retention ends.
      required: [id, displayName, state, createdAt, replayUntil, canReplay]
      properties:
        id: { $ref: './common.yaml#/components/schemas/UuidV7' }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        state: { type: string, enum: [COMMITTED, PROCESSING, NOT_COMMITTED, UNKNOWN] }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        replayUntil: { $ref: '#/components/schemas/Timestamp' }
        canReplay: { type: boolean }
        tenantId: { $ref: './common.yaml#/components/schemas/UuidV7' }
        idempotencyKey: { $ref: './common.yaml#/components/schemas/UuidV7' }
      additionalProperties: false
    TenantStatus:
      type: string
      enum: [PENDING, ACTIVE, SUSPENDED, CLOSED]
    Tenant:
      type: object
      required: [id, displayName, status, expiresAt, createdAt, updatedAt]
      properties:
        id: { $ref: './common.yaml#/components/schemas/UuidV7' }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        status: { $ref: '#/components/schemas/TenantStatus' }
        expiresAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
      additionalProperties: false
    CreateTenantRequest:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 200 }
        expiresAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
      additionalProperties: false
    TenantAdministratorPasswordSetup:
      type: object
      additionalProperties: false
      required: [tenantId, state, operationState, canResend, canContinue]
      properties:
        tenantId: { $ref: './common.yaml#/components/schemas/UuidV7' }
        state:
          type: string
          enum: [NOT_APPLICABLE, PENDING, MAIL_SERVICE_ACCEPTED, PASSWORD_READY, ACTION_REQUIRED]
        operationState:
          type: string
          enum: [NONE, PENDING, COMPLETED, UNKNOWN]
          description: Original actor operation result, independent of latest mail status. UNKNOWN never authorizes a new operation.
        canResend:
          type: boolean
          description: An independent new notification request is applicable; never an initialization action.
        canContinue:
          type: boolean
          description: The original actor can continue a pending resend whose automatic recovery is exhausted.
        resendId:
          $ref: './common.yaml#/components/schemas/UuidV7'

    TenantAdministratorInitialization:
      type: object
      additionalProperties: false
      required: [tenantId, state, canStart, canContinue, initialAdministratorMembershipId]
      properties:
        tenantId: { $ref: './common.yaml#/components/schemas/UuidV7' }
        initializationId:
          $ref: './common.yaml#/components/schemas/UuidV7'
        state:
          type: string
          enum: [NOT_STARTED, PROCESSING, RECOVERY_REQUIRED, COMPENSATING, RETRY_REQUIRED, SUCCEEDED, FAILED]
        canStart:
          type: boolean
          description: A first attempt or a new attempt after completed compensation is allowed.
        canContinue:
          type: boolean
          description: Only the original actor may explicitly continue this exact attempt.
        initialAdministratorMembershipId:
          type: [string, 'null']
          format: uuid
          description: Immutable historical Membership relationship, not the current administrator set.
        failureCode:
          type: string
          description: Stable business rejection code; never internal diagnostics.

    AdministratorInitializationRequest:
      type: object
      required: [administratorEmail]
      properties:
        administratorEmail: { $ref: '#/components/schemas/Email' }
        administratorDisplayName:
          type: string
          minLength: 1
          maxLength: 200
      additionalProperties: false
    QuotaDefinitionStatus:
      type: string
      enum: [DRAFT, ACTIVE, RETIRED]
    QuotaDefinition:
      type: object
      required: [id, code, status, createdAt, updatedAt]
      properties:
        id: { $ref: './common.yaml#/components/schemas/UuidV7' }
        code: { type: string, const: max_users }
        status: { $ref: '#/components/schemas/QuotaDefinitionStatus' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
      additionalProperties: false
    CreateQuotaDefinitionRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, const: max_users }
      additionalProperties: false
    PlanStatus:
      type: string
      enum: [DRAFT, ACTIVE, RETIRED]
    PlanQuotaLimit:
      type: object
      required: [quotaDefinitionId, limit]
      properties:
        quotaDefinitionId: { $ref: './common.yaml#/components/schemas/UuidV7' }
        limit: { type: integer, minimum: 0 }
      additionalProperties: false
    Plan:
      type: object
      required: [id, code, displayName, status, quotaLimits, createdAt, updatedAt]
      properties:
        id: { $ref: './common.yaml#/components/schemas/UuidV7' }
        code:
          type: string
          pattern: '^[a-z][a-z0-9-]{1,62}$'
        displayName: { type: string, minLength: 1, maxLength: 200 }
        status: { $ref: '#/components/schemas/PlanStatus' }
        quotaLimits:
          type: array
          minItems: 1
          maxItems: 1
          items: { $ref: '#/components/schemas/PlanQuotaLimit' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
      additionalProperties: false
    NewPlanQuotaLimit:
      type: object
      description: New grants require max_users of at least 1. Historical Plan responses retain the zero-capable PlanQuotaLimit schema.
      required: [quotaDefinitionId, limit]
      properties:
        quotaDefinitionId: { $ref: './common.yaml#/components/schemas/UuidV7' }
        limit: { type: integer, minimum: 1 }
      additionalProperties: false
    CreatePlanRequest:
      type: object
      required: [code, displayName, quotaLimits]
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9-]{1,62}$'
        displayName: { type: string, minLength: 1, maxLength: 200 }
        quotaLimits:
          type: array
          minItems: 1
          maxItems: 1
          items: { $ref: '#/components/schemas/NewPlanQuotaLimit' }
      additionalProperties: false
    Subscription:
      type: object
      required: [id, tenantId, planId, status, endsAt, createdAt]
      properties:
        id: { $ref: './common.yaml#/components/schemas/UuidV7' }
        tenantId: { $ref: './common.yaml#/components/schemas/UuidV7' }
        planId: { $ref: './common.yaml#/components/schemas/UuidV7' }
        status: { type: string, const: ACTIVE }
        endsAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/Timestamp' }
      additionalProperties: false
    CreateInitialSubscriptionRequest:
      type: object
      required: [planId]
      properties:
        planId: { $ref: './common.yaml#/components/schemas/UuidV7' }
        endsAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
      additionalProperties: false
    RegisterRemoteManifestRequest:
      type: object
      additionalProperties: false
      required: [module, version, source, uiVersion, entrySha256]
      properties:
        module: { type: string, pattern: '^[a-z][a-z0-9-]{1,62}$' }
        version: { type: string, pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' }
        source: { type: string, maxLength: 512 }
        uiVersion: { type: string, minLength: 1, maxLength: 100 }
        entrySha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    EnabledRemoteManifest:
      type: object
      additionalProperties: false
      required: [id, module, version, source, uiVersion, entrySha256]
      properties:
        id: { $ref: './common.yaml#/components/schemas/UuidV7' }
        module: { type: string, pattern: '^[a-z][a-z0-9-]{1,62}$' }
        version: { type: string, pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' }
        source: { type: string, maxLength: 512 }
        uiVersion: { type: string, minLength: 1, maxLength: 100 }
        entrySha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    RemoteManifest:
      type: object
      additionalProperties: false
      required: [id, module, version, source, uiVersion, entrySha256, state, registeredBy, registeredAt, reviewedBy, reviewedAt, enabledBy, enabledAt]
      properties:
        id: { $ref: './common.yaml#/components/schemas/UuidV7' }
        module: { type: string, pattern: '^[a-z][a-z0-9-]{1,62}$' }
        version: { type: string, pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' }
        source: { type: string, maxLength: 512 }
        uiVersion: { type: string, minLength: 1, maxLength: 100 }
        entrySha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        state: { type: string, enum: [PENDING_REVIEW, APPROVED, REJECTED, ENABLED] }
        registeredBy: { $ref: './common.yaml#/components/schemas/UuidV7' }
        registeredAt: { type: string, format: date-time }
        reviewedBy: { type: [string, 'null'], format: uuid }
        reviewedAt: { type: [string, 'null'], format: date-time }
        enabledBy: { type: [string, 'null'], format: uuid }
        enabledAt: { type: [string, 'null'], format: date-time }
    RemoteManifestPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/RemoteManifest' }
        nextCursor: { type: [string, 'null'], maxLength: 256 }
        hasMore: { type: boolean }
    EnabledRemoteManifestPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/EnabledRemoteManifest' }
        nextCursor: { type: [string, 'null'], maxLength: 256 }
        hasMore: { type: boolean }
    RuntimeScope:
      type: string
      enum:
        - 'remote-delivery:manifest:register'
        - 'runtime:read'
        - 'runtime:quota:write'
        - 'tenant-access:membership:read'
        - 'tenant-access:tenant:read'
        - 'iam:identity:write'
        - 'iam:password-setup:write'
        - 'iam:platform-role:read'
        - 'iam:sessions:write'
        - 'entitlement:quota:write'
    OAuthClientType:
      type: string
      enum: [RUNTIME_SERVICE, RESERVED_SERVICE, CI_CLIENT]
    ReservedServiceKey:
      type: string
      enum: [IAM, TENANT_ACCESS, ENTITLEMENT, REMOTE_DELIVERY]
    OAuthClientStatus:
      type: string
      enum: [ACTIVE, REVOKED]
    OAuthClient:
      type: object
      required: [clientId, displayName, allowedScopes, status, createdAt, updatedAt]
      properties:
        clientId: { $ref: './common.yaml#/components/schemas/UuidV7' }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        allowedScopes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/RuntimeScope' }
        status: { $ref: '#/components/schemas/OAuthClientStatus' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
      additionalProperties: false
    CreateOAuthClientRequest:
      type: object
      required: [displayName, allowedScopes]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 200 }
        allowedScopes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/RuntimeScope' }
      additionalProperties: false
    SecretIssuanceRecoveryRequest:
      type: object
      required: [originalIdempotencyKey]
      properties:
        originalIdempotencyKey: { $ref: './common.yaml#/components/schemas/UuidV7' }
      additionalProperties: false
    OAuthClientCredentialStatus:
      type: object
      required: [clientId, canRotate, canRevoke]
      properties:
        clientId: { $ref: './common.yaml#/components/schemas/UuidV7' }
        overlapEndsAt: { $ref: '#/components/schemas/Timestamp' }
        canRotate: { type: boolean }
        canRevoke: { type: boolean }
      additionalProperties: false
    OAuthClientOperation:
      type: object
      required: [operationId, clientId, displayName, action, completedAt, canRecover]
      properties:
        operationId: { $ref: './common.yaml#/components/schemas/UuidV7' }
        clientId: { $ref: './common.yaml#/components/schemas/UuidV7' }
        displayName: { type: string }
        action: { type: string, enum: [CREATE, ROTATE, RECOVER, REVOKE] }
        completedAt: { $ref: '#/components/schemas/Timestamp' }
        recoveryUntil: { $ref: '#/components/schemas/Timestamp' }
        canRecover: { type: boolean }
      additionalProperties: false
    OAuthClientOperationPage:
      type: object
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OAuthClientOperation' }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
      additionalProperties: false
    OAuthClientSecretResult:
      type: object
      required: [clientId, displayName, allowedScopes, status, createdAt, updatedAt, clientSecret]
      properties:
        clientId: { $ref: './common.yaml#/components/schemas/UuidV7' }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        allowedScopes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/RuntimeScope' }
        status: { $ref: '#/components/schemas/OAuthClientStatus' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        clientSecret:
          type: string
          minLength: 1
          writeOnly: true
          description: Returned exactly once. Store it in a controlled secret manager.
      additionalProperties: false
    OAuthClientPage:
      allOf:
        - $ref: './common.yaml#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/OAuthClientDetail' }
            nextCursor:
              oneOf:
                - type: string
                - type: 'null'
            hasMore: { type: boolean }
    OAuthClientDetail:
      type: object
      required: [clientId, displayName, clientType, allowedScopes, status, createdAt, updatedAt]
      properties:
        clientId: { $ref: './common.yaml#/components/schemas/UuidV7' }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        clientType: { $ref: '#/components/schemas/OAuthClientType' }
        reservedServiceKey:
          oneOf:
            - $ref: '#/components/schemas/ReservedServiceKey'
            - type: 'null'
        allowedScopes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/RuntimeScope' }
        status: { $ref: '#/components/schemas/OAuthClientStatus' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        revokedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
      additionalProperties: false
