spring:
  application:
    name: project-service
  cloud:
    nacos:
      username: ${NACOS_PROJECT_USERNAME:}
      password: ${NACOS_PROJECT_PASSWORD:}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:dev}
        ssl:
          enabled: ${NACOS_TLS_ENABLED:false}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:dev}
        service: project-service
  kafka:
    producer:
      acks: all
      properties:
        max.block.ms: 3000
        delivery.timeout.ms: 10000
        request.timeout.ms: 3000
  jackson:
    mapper:
      allow-coercion-of-scalars: false
    deserialization:
      fail-on-unknown-properties: true
saas.forge:
  environment: ${SAASFORGE_ENVIRONMENT:dev}
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    local-cache-scope: STATEMENT

logging:
  structured:
    format:
      console: io.saas.forge.observability.ForgeLogFormatter
management:
  observations:
    enable:
      http.server.requests: false
      http.client.requests: false

---
spring:
  config:
    activate:
      on-profile: "!local-file"
    import: nacos:project-service.yaml?group=SAAS_FORGE&refreshEnabled=false
